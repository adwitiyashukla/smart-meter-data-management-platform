name: keepalive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the Space
        env:
          SPACE_URL: https://adwitiyashukla-smart-meter-data-management-platform.hf.space/
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 90 "$SPACE_URL")
            echo "attempt $attempt returned $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "space did not answer with 200"
          exit 1
